feature_id: "006"
status: "ACCEPTED/LOCKED"
nodes:
  - id: "ui"
    owner: Desktop UI
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "owner"
    owner: domain owner service
    kind: service
  - id: "storage"
    owner: Storage
    kind: store
  - id: "provider"
    owner: external provider HTTP
    kind: external
  - id: "secrets"
    owner: SecretStore (OS keystore via OsSecretStore; broker-only resolver)
    kind: store
  - id: "reconciler"
    owner: Capability reconciler
    kind: service
edges:
  - id: "e-ui-op"
    from: "ui"
    to: "operator"
    kind: command
  - id: "e-op-owner"
    from: "operator"
    to: "owner"
    kind: request
  - id: "e-owner-storage"
    from: "owner"
    to: "storage"
    kind: transaction
  - id: "e-storage-ui"
    from: "storage"
    to: "ui"
    kind: projection
  - id: "e-owner-provider"
    from: "owner"
    to: "provider"
    kind: http
  - id: "e-owner-secrets"
    from: "owner"
    to: "secrets"
    kind: custody
  - id: "e-owner-reconciler"
    from: "owner"
    to: "reconciler"
    kind: request
  - id: "e-reconciler-provider"
    from: "reconciler"
    to: "provider"
    kind: http
  - id: "e-reconciler-storage"
    from: "reconciler"
    to: "storage"
    kind: transaction
transactions:
  - id: "tx-connection"
    owner: ConnectionService
    atomic_records: ["connection"]
    external_calls_inside: false
  - id: "tx-invoke"
    owner: CapabilityBroker
    atomic_records: ["invocation","approval","idempotency_receipt"]
    external_calls_inside: false
  - id: "tx-revoke"
    owner: ConnectionService
    atomic_records: ["connection","capability_grants","connection_state_event","idempotency_receipt"]
    external_calls_inside: false
  - id: "tx-reconcile"
    owner: Capability reconciler
    atomic_records: ["invocation","effect","evidence"]
    external_calls_inside: false
external_boundaries:
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile

# Current source boundary checked 2026-11-06
# The graph above describes the target Connection/CapabilityBroker flow, not current wiring.
# Discover search/detail is served. connect-or-install returns 503 because LiteSPM is
# not qualified; test returns UNKNOWN without contacting a provider. Connection list/get/
# disconnect are target-only. The current SecretStore is not used by a ConnectionService.
# Approval resolve is served, but the Trust evaluator is dead-code/unwired and Approval
# resolution does not dispatch an action. CapabilityInvocation APIs are GET-only; SQLite
# refuses DISPATCHED admission. The provider/secret/invocation/effect edges must remain
# TARGET until the golden OAuth/read/write flow and reconciliation are qualified.

# Owner acceptance 2026-11-09 (docs/OWNER-ACCEPTANCE-REVIEW-PACKET.md): status ACCEPTED/LOCKED
# authorizes implementation of this target wiring. It does not make any edge SERVED, INTEGRATED
# or QUALIFIED. Keystore writes and removals happen outside tx-connection and tx-revoke (before
# commit on connect, after commit on revoke). The provider edges allow only api.github.com for
# Invocations and the GitHub OAuth token endpoint for ConnectionService. No edge reaches LiteSPM:
# package lifecycle belongs to package 013. tx-revoke, tx-reconcile and the reconciler node are
# accepted target wiring added in revision 1.0, not yet in source.
