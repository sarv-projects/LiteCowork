feature_id: "018"
name: "Usage, Diagnostics and Observability"
status: "IN_REVIEW"
spec_revision: "0.1"
note: "All links are target design pending owner acceptance of B-42. Only the quota observation read (returns null) is served today."
nodes:
  - id: "session-supervisor"
    owner: "Feature 001 AgentSessionSupervisor"
    kind: "runtime supervisor"
    responsibility: "Passes typed adapter usage counters to the normalizer at settlement"
    implementation_status: "CODE for OpenCode dispatch; no usage counters passed today"
    inputs: ["adapter final event"]
    outputs: ["AdapterUsageCounters or none"]
  - id: "usage-normalizer"
    owner: "Observability (storage-core usage module)"
    kind: "pure function"
    responsibility: "normalize_turn_usage mapping to attribution, confidence and completeness"
    implementation_status: "TARGET_ONLY"
    inputs: ["AdapterUsageCounters", "response byte length"]
    outputs: ["TurnUsageDraft"]
  - id: "settlement-store"
    owner: "Feature 001 via Storage"
    kind: "transaction boundary"
    responsibility: "Writes the usage record inside the final-response transaction"
    implementation_status: "TARGET_ONLY: no usage table exists"
    inputs: ["TurnUsageDraft"]
    outputs: ["usage record row"]
  - id: "usage-reader"
    owner: "Observability (storage-sqlite usage module)"
    kind: "read model"
    responsibility: "Leaf-additive summary, items and Conversation usage"
    inputs: ["owner, Workspace, window, filter"]
    outputs: ["UsageSummaryView", "UsageItemsPage"]
  - id: "usage-routes"
    owner: "litecoworkd Operator"
    kind: "authenticated boundary"
    responsibility: "Owner scope, window validation, no-store, export"
    implementation_status: "TARGET_ONLY: getConversationUsage is target_only"
    inputs: ["IPC request"]
    outputs: ["usage views", "export receipt"]
  - id: "quota-route"
    owner: "litecoworkd Operator"
    kind: "authenticated boundary"
    responsibility: "Owner-scoped quota observation read"
    implementation_status: "SERVED: agent_quota_observation_operator.rs returns null"
    inputs: ["IPC request"]
    outputs: ["QuotaObservation or null"]
  - id: "diagnostic-log"
    owner: "Observability (daemon diagnostics log)"
    kind: "bounded sink"
    responsibility: "Typed entries in a ring plus rotated files; drops debug entries under backpressure"
    implementation_status: "TARGET_ONLY: 12 eprintln sites today"
    inputs: ["DiagnosticEntry"]
    outputs: ["log pages", "rotated files"]
  - id: "crash-recorder"
    owner: "Observability (daemon and desktop crash hook)"
    kind: "panic hook"
    responsibility: "Bounded local crash record; never uploaded"
    implementation_status: "TARGET_ONLY: no panic hook"
    inputs: ["panic info"]
    outputs: ["crash record file"]
  - id: "health-observer"
    owner: "Observability with Feature 011 Runtime lifecycle"
    kind: "probe projection"
    responsibility: "Probe states with age; serving separate from execution readiness"
    inputs: ["Runtime readiness", "startup blockers", "IPC and SQLite checks"]
    outputs: ["HealthProbeView list"]
  - id: "diagnostics-routes"
    owner: "litecoworkd Operator"
    kind: "authenticated boundary"
    responsibility: "Build info, health, logs, crash records, bundle preview and write"
    implementation_status: "TARGET_ONLY"
    inputs: ["IPC request"]
    outputs: ["diagnostic views", "bundle receipt"]
  - id: "support-bundle-writer"
    owner: "Observability (daemon diagnostics bundle)"
    kind: "file writer"
    responsibility: "Allowlisted categories, home-prefix replacement, manifest, cap, local only"
    inputs: ["selected categories", "destination handle"]
    outputs: ["bundle file", "receipt"]
  - id: "tauri-usage-diagnostics-bridge"
    owner: "Desktop Tauri bridge"
    kind: "desktop transport"
    responsibility: "Typed commands, strict decode, native save dialog, desktop crash hook"
    inputs: ["typed UI command"]
    outputs: ["authenticated IPC request"]
  - id: "settings-usage-ui"
    owner: "Desktop UI (Settings Usage and Monitoring)"
    kind: "component"
    responsibility: "Ranges, filters, lanes, quota cards, accessible table, export"
    inputs: ["usage views", "quota observations"]
    outputs: ["typed commands"]
  - id: "settings-about-ui"
    owner: "Desktop UI (Settings About and Diagnostics)"
    kind: "component"
    responsibility: "Build info, health, logs, crash records, bundle preview and write"
    inputs: ["diagnostic views"]
    outputs: ["typed commands"]
  - id: "owner-file"
    owner: "Owner file system"
    kind: "external file"
    responsibility: "Usage export and support bundle destination"
    inputs: ["bounded bytes"]
    outputs: ["file on disk"]
edges:
  - id: "e01"
    from: "session-supervisor"
    to: "usage-normalizer"
    kind: "function call"
    contract: "normalize_turn_usage outside any provider call"
  - id: "e02"
    from: "usage-normalizer"
    to: "settlement-store"
    kind: "transaction input"
    contract: "TurnUsageDraft stored in the Feature 001 final-response transaction"
  - id: "e03"
    from: "usage-routes"
    to: "usage-reader"
    kind: "read"
    contract: "UsageLedgerReader owner and Workspace scoped"
  - id: "e04"
    from: "usage-reader"
    to: "settlement-store"
    kind: "read snapshot"
    contract: "leaf records with covering index"
  - id: "e05"
    from: "tauri-usage-diagnostics-bridge"
    to: "usage-routes"
    kind: "authenticated-request"
    contract: "SPEC 7.2 usage routes over LOCAL-OPERATOR-IPC"
  - id: "e06"
    from: "tauri-usage-diagnostics-bridge"
    to: "quota-route"
    kind: "authenticated-request"
    contract: "GET /v1/agent-bindings/{agent_binding_id}/quota-observation"
  - id: "e07"
    from: "tauri-usage-diagnostics-bridge"
    to: "diagnostics-routes"
    kind: "authenticated-request"
    contract: "SPEC 7.2 diagnostics routes"
  - id: "e08"
    from: "diagnostics-routes"
    to: "diagnostic-log"
    kind: "read"
    contract: "bounded page of typed entries"
  - id: "e09"
    from: "diagnostics-routes"
    to: "crash-recorder"
    kind: "read"
    contract: "list local crash records"
  - id: "e10"
    from: "diagnostics-routes"
    to: "health-observer"
    kind: "read"
    contract: "probe views with age"
  - id: "e11"
    from: "diagnostics-routes"
    to: "support-bundle-writer"
    kind: "command"
    contract: "preview then explicit write"
  - id: "e12"
    from: "support-bundle-writer"
    to: "owner-file"
    kind: "file io"
    contract: "create-new, fsync, cap, manifest"
  - id: "e13"
    from: "usage-routes"
    to: "owner-file"
    kind: "file io"
    contract: "bounded usage export"
  - id: "e14"
    from: "settings-usage-ui"
    to: "tauri-usage-diagnostics-bridge"
    kind: "typed command"
    contract: "contracts/ui-behavior.md usage commands"
  - id: "e15"
    from: "settings-about-ui"
    to: "tauri-usage-diagnostics-bridge"
    kind: "typed command"
    contract: "contracts/ui-behavior.md diagnostics commands"
transactions:
  - id: "tx-turn-usage-record"
    owner: "Feature 001 final-response transaction (Storage)"
    atomic_records: ["usage record row", "AGENT ConversationMessage", "settled ConversationTurn", "response receipt"]
    external_calls_inside: false
    known_gap: "Target only; Feature 001 owns the transaction and has not added the usage row yet"
  - id: "tx-support-bundle-receipt"
    owner: "Observability diagnostics bundle"
    atomic_records: ["bundle file created with create-new and fsync", "manifest of digests", "request receipt in memory keyed by Idempotency-Key"]
    external_calls_inside: false
external_boundaries:
  - id: "adapter-usage-counters"
    owner: "Feature 001 AgentAdapter"
    input_trust: "untrusted"
    timeout: "part of the turn's bounded final event read"
    retry: "none; missing counters become UNKNOWN or ESTIMATED_LOCAL"
  - id: "owner-file-write"
    owner: "Observability"
    input_trust: "owner-chosen local path via Tauri dialog"
    timeout: "bounded by the 10 MiB cap"
    retry: "owner retries; partial file removed"
  - id: "os-metadata"
    owner: "HealthObserver and build info"
    input_trust: "os-service"
    timeout: "finite; stale after cutoff"
    retry: "next refresh; UNKNOWN meanwhile"
