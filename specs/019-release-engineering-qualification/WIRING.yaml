feature_id: "019"
name: "Release Engineering and V1 Qualification"
status: "IN_REVIEW"
spec_revision: "0.1"
notes: "All edges are TARGET unless marked CODE. Nothing here is served or qualified. CI files are added via pull request only."
nodes:
  - id: "pull-request"
    owner: "Contributor"
    kind: "external actor"
    responsibility: "Proposes code and workflow changes; untrusted until reviewed"
    inputs: ["source changes"]
    outputs: ["CI trigger"]
  - id: "ci-linux"
    owner: "Release Engineering"
    kind: "native Linux x64 runner"
    responsibility: "check.sh, feature validator, served-route audit, frontend test/build, src-tauri tests, secret scan, dependency audit"
    implementation_status: "TARGET_ONLY: .github/ does not exist"
    inputs: ["pull-request"]
    outputs: ["gate verdict", "CI artifacts"]
  - id: "ci-windows"
    owner: "Release Engineering"
    kind: "native Windows x64 runner"
    responsibility: "Rust workspace tests including windows-local-security and operator-ipc, src-tauri tests, frontend tests; never WSL2"
    implementation_status: "TARGET_ONLY"
    inputs: ["pull-request"]
    outputs: ["gate verdict"]
  - id: "existing-gates"
    owner: "Release Engineering"
    kind: "scripts"
    responsibility: "scripts/check.sh, .specify/scripts/validate_feature_package.py, scripts/audit_served_routes.py, scripts/v1_secret_scan.py, scripts/v1_packaging_check.py"
    implementation_status: "CODE: scripts exist; not wired to CI"
    inputs: ["checkout"]
    outputs: ["pass/fail with stage durations"]
  - id: "release-job"
    owner: "Release Engineering"
    kind: "protected CI job"
    responsibility: "Build sidecar and bundles on protected tags, call signing service, publish artifacts, checksums and manifest"
    implementation_status: "TARGET_ONLY"
    inputs: ["green gates", "protected tag"]
    outputs: ["signed artifacts", "update manifest"]
  - id: "sidecar-build"
    owner: "Desktop Shell"
    kind: "build script"
    responsibility: "apps/litecowork-ui/scripts/build-daemon-sidecar.mjs builds litecoworkd for the target triple and copies it into src-tauri/binaries"
    implementation_status: "CODE"
    inputs: ["target triple"]
    outputs: ["litecoworkd-<triple>[.exe]"]
  - id: "tauri-bundler"
    owner: "Desktop Shell"
    kind: "build tool"
    responsibility: "tauri build via run-tauri.mjs with tauri.bundle.conf.json: NSIS, MSI on Windows; deb on Linux"
    implementation_status: "CODE for unsigned bundles with targets all; declared targets are TARGET"
    inputs: ["frontend dist", "sidecar"]
    outputs: ["installers"]
  - id: "signing-service"
    owner: "Security"
    kind: "external HSM signing service"
    responsibility: "Authenticode signatures with timestamp; updater Ed25519 signatures; holds private keys"
    implementation_status: "TARGET_ONLY: pending B-43"
    inputs: ["artifact digests"]
    outputs: ["signatures"]
  - id: "update-manifest"
    owner: "Release Engineering"
    kind: "static HTTPS resource"
    responsibility: "Signed stable-channel manifest at the pinned origin"
    implementation_status: "TARGET_ONLY"
    inputs: ["signed artifacts"]
    outputs: ["manifest JSON"]
  - id: "update-panel"
    owner: "Desktop UI"
    kind: "component"
    responsibility: "UpdatePanel mounted by Feature 011 Advanced tab; renders update-state reducer"
    implementation_status: "TARGET_ONLY"
    inputs: ["owner action", "UpdateCheckOutcome", "UpdateInstallOutcome"]
    outputs: ["typed Tauri commands"]
  - id: "updater-bridge"
    owner: "Desktop Shell"
    kind: "Tauri Rust commands"
    responsibility: "check_for_update and install_update; signature checks, downgrade refusal, single-flight, UpdateAttempt record"
    implementation_status: "TARGET_ONLY"
    inputs: ["update-panel commands", "manifest"]
    outputs: ["gate call", "stop request", "installer handoff"]
  - id: "quiescence-gate"
    owner: "Runtime (Feature 011)"
    kind: "accepted target interface"
    responsibility: "UpdateQuiescenceGate::check returns PositiveQuiescence or NotQuiescent(reasons); authenticated Runtime stop"
    implementation_status: "TARGET_ONLY in Feature 011"
    inputs: ["incarnation"]
    outputs: ["quiescence verdict", "stop receipt"]
  - id: "runtime"
    owner: "litecoworkd"
    kind: "daemon"
    responsibility: "Owner domains; forward-only migrations on first start of a new version"
    inputs: ["OS-authenticated IPC"]
    outputs: ["readiness", "settlement state"]
  - id: "installer"
    owner: "Release Engineering"
    kind: "signed installer process"
    responsibility: "Install, upgrade, uninstall per user; preserve user data by default"
    implementation_status: "TARGET_ONLY for signed per-user configuration"
    inputs: ["handoff"]
    outputs: ["installed version", "exit code"]
  - id: "release-host"
    owner: "QA"
    kind: "native release-row machine"
    responsibility: "Windows 11/10 x64 or Linux x64 desktop running packaged journeys; never WSL2"
    inputs: ["signed artifacts"]
    outputs: ["SYSTEM traces", "USER artifacts"]
  - id: "matrix-generator"
    owner: "QA"
    kind: "script"
    responsibility: "scripts/v1_platform_matrix.py with declared rows; NOT_COUNTED detection; per E2E cells"
    implementation_status: "CODE for host probes; rows and E2E cells TARGET"
    inputs: ["release-host probes", "bundle index"]
    outputs: ["QUALIFICATION-MATRIX.md/json"]
  - id: "evidence-bundler"
    owner: "QA"
    kind: "script"
    responsibility: "scripts/v1_evidence_bundle.py assembles, validates and secret-scans bundles"
    implementation_status: "TARGET_ONLY"
    inputs: ["SYSTEM traces", "USER artifacts", "CODE outputs"]
    outputs: ["bundle digest", "index entry"]
  - id: "release-gate"
    owner: "Product"
    kind: "decision tool"
    responsibility: "scripts/v1_release_gate.py prints GO or NO-GO with missing packages, rows and cells"
    implementation_status: "TARGET_ONLY"
    inputs: ["matrix", "bundle index", "package statuses"]
    outputs: ["release decision"]
edges:
  - id: "e01"
    from: "pull-request"
    to: "ci-linux"
    kind: "trigger"
    contract: "TESTING release gates (promoted by T02)"
  - id: "e02"
    from: "pull-request"
    to: "ci-windows"
    kind: "trigger"
    contract: "TESTING release gates; B-28 checklist"
  - id: "e03"
    from: "ci-linux"
    to: "existing-gates"
    kind: "invoke"
    contract: "scripts/check.sh and validators"
  - id: "e04"
    from: "ci-windows"
    to: "existing-gates"
    kind: "invoke"
    contract: "scripts/check.ps1 (new) Rust stages"
  - id: "e05"
    from: "release-job"
    to: "sidecar-build"
    kind: "invoke"
    contract: "build-daemon-sidecar.mjs"
  - id: "e06"
    from: "release-job"
    to: "tauri-bundler"
    kind: "invoke"
    contract: "run-tauri.mjs build --bundles"
  - id: "e07"
    from: "tauri-bundler"
    to: "signing-service"
    kind: "external call"
    contract: "bundle.windows.signCommand (B-43)"
  - id: "e08"
    from: "release-job"
    to: "update-manifest"
    kind: "publish"
    contract: "signed stable manifest (B-43)"
  - id: "e09"
    from: "update-panel"
    to: "updater-bridge"
    kind: "Tauri command"
    contract: "check_for_update / install_update (contracts/api-events.md)"
  - id: "e10"
    from: "updater-bridge"
    to: "update-manifest"
    kind: "HTTPS fetch"
    contract: "pinned origin; signature verified with embedded key"
  - id: "e11"
    from: "updater-bridge"
    to: "quiescence-gate"
    kind: "Tauri command"
    contract: "check_update_quiescence (Feature 011)"
  - id: "e12"
    from: "quiescence-gate"
    to: "runtime"
    kind: "authenticated Operator call"
    contract: "Feature 011 stop preview and stop"
  - id: "e13"
    from: "updater-bridge"
    to: "installer"
    kind: "process handoff"
    contract: "only after STOPPED proof"
  - id: "e14"
    from: "release-host"
    to: "matrix-generator"
    kind: "probe"
    contract: "declared rows file"
  - id: "e15"
    from: "release-host"
    to: "evidence-bundler"
    kind: "evidence"
    contract: "release-evidence-bundle.schema.json (new)"
  - id: "e16"
    from: "evidence-bundler"
    to: "existing-gates"
    kind: "invoke"
    contract: "v1_secret_scan.py on bundle"
  - id: "e17"
    from: "matrix-generator"
    to: "release-gate"
    kind: "input"
    contract: "QUALIFICATION-MATRIX.json"
  - id: "e18"
    from: "evidence-bundler"
    to: "release-gate"
    kind: "input"
    contract: "evidence INDEX"
transactions:
  - id: "tx-update-attempt-record"
    owner: "updater-bridge"
    atomic_records: ["UpdateAttempt state file written via write-then-rename"]
    external_calls_inside: false
    note: "Local file replace only; manifest fetch, download and installer launch happen between record writes, never inside one"
  - id: "tx-matrix-write"
    owner: "matrix-generator"
    atomic_records: ["QUALIFICATION-MATRIX.json", "QUALIFICATION-MATRIX.md"]
    external_calls_inside: false
    note: "Probes complete first; outputs written by temp file and rename"
  - id: "tx-bundle-index-append"
    owner: "evidence-bundler"
    atomic_records: ["evidence INDEX entry with bundle digest"]
    external_calls_inside: false
external_boundaries:
  - id: "signing"
    owner: "signing-service"
    input_trust: "trusted service, authenticated"
    timeout: "bounded per artifact"
    retry: "retry same digest; never fall back to unsigned"
  - id: "manifest-fetch"
    owner: "updater-bridge"
    input_trust: "untrusted until signature verified"
    timeout: "bounded"
    retry: "manual Retry only; failure shows Could not check"
  - id: "installer-run"
    owner: "installer"
    input_trust: "signed artifact"
    timeout: "bounded with exit code"
    retry: "next launch settles UpdateAttempt; owner may retry"
  - id: "native-agent-version-probe"
    owner: "matrix-generator"
    input_trust: "external process output"
    timeout: "bounded"
    retry: "record observation; never infer support"
recovery:
  owner: "updater-bridge with Feature 011 Runtime"
  source_of_truth: ["UpdateAttempt record", "installed version", "daemon startup blockers"]
  restart_action: "settle interrupted UpdateAttempt; daemon runs forward-only migration or reports DEGRADED with a startup blocker"
  ui_action: "show last attempt result and Retry"
