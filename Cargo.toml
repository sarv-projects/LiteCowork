[workspace]
members = [
  "apps/litecoworkd",
  "crates/operator-ipc",
  "crates/windows-local-security",
  "crates/storage-core",
  "crates/storage-sqlite",
  "crates/domain-task",
  "crates/domain-responsibility",
  "crates/domain-workspace",
  "crates/domain-effects",
  "crates/domain-invocations",
  "crates/domain-environment",
  "crates/domain-conversation",
  "crates/domain-rag",
  "crates/local-environment-staging",
  "crates/linux-process-scope",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
# 1.89 is the floor for `File::try_lock_exclusive`/`File::unlock`, which
# crates/storage-sqlite/src/backup.rs calls for the Runtime lock. 1.88 was chosen
# to match the locked `time` release and no longer compiles this tree.
rust-version = "1.89"

[workspace.lints.rust]
# Unsafe Win32 security calls are isolated to windows-local-security. Other crates may
# not locally override this deny lint.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
